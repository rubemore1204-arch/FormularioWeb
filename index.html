<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con estilos CSS</title>
    <link rel="stylesheet" type="text/CSS" href="CSS/index.css">
   
</head>
<body>
    <div class="contenedor">
        <div class="contenedor-logo">
            <img src="img/canasta.jfif" width="200" height="200">
        </div>
    <h1>FORMULARIO DE CAPTURA DE DATOS</h1>
    <h2>NUEVO PEDIDO</h2>
    <form>
        <div class="cuadro-azul">
            <table>
                <tr>
                <td>Nombre:</td>
                <td><input type="text" name="Nombre" class="dato"></td>    
                </tr>

                <tr>
                <td>Apellido:</td>
                <td><input type="text" name="Apellidos" class="dato"></td>    
                </tr>

                <tr>
                <td>Dirección:</td>
                <td><input type="text" name="Dirección" class="dato"></td>    
                </tr>
            </table>
        </div>
        <div class="cuadro-azul">
            <p>Número de tarjeta de crédito</p>
            <p><input type="text" name="Tarjeta" class="dato"></p>
            <p><input type="radio" name="Banco">Banamex</p>
            <p><input type="radio" name="Banco">Banorte</p>
            <p><input type="radio" name="Banco">HSBC</p>
            <p><input type="radio" name="Banco">Banco Azteca</p>
        </div>
        <div class="contenedor-enviar">
            <input type="submit" value="Realizar Pedido">
        </div>
    </form>
    <div class="pie">
        <p>copyright 2026 - Derechis reservados Rmoreno Shop</p>
        <p>Programador derechos reservador</p>
    </div>

</div>
</body>
</html>
